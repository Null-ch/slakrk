server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
}
